name: Build Magic Wand APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project
        shell: bash
        run: |
          set -e
          mkdir -p _project
          unzip -q "magic-wand (1).zip" -d _project
          PROJECT_DIR="$(find _project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find Android Gradle project after extracting the ZIP."
            find _project -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper is missing; generating it from the installed Gradle."
            gradle --version
            gradle wrapper
          fi
          chmod +x ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Prepare debug signing keystore
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore is missing; generating a standard debug keystore."
            keytool -genkeypair -v               -keystore debug.keystore               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-wand-debug-apk
          path: "$PROJECT_DIR/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
